# The Artilody server as the Pi's web site (port 80). Installed by install.sh
# as /etc/apache2/sites-available/artilody.conf (replaces 000-default).
<VirtualHost *:80>
    ServerName artilody-server
    DocumentRoot /var/www/artilody/public
    DirectoryIndex index.php

    # code and data outside the web root (lib/, schema.sql): never served
    <Directory /var/www/artilody>
        Require all denied
    </Directory>
    <Directory /var/www/artilody/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # The media library's files by their sha1 (lib/media.php): served by
    # Apache itself - with ranges, so an interrupted download resumes.
    Alias /blobs/ /var/lib/artilody/blobs/
    <Directory /var/lib/artilody/blobs>
        Options -Indexes
        AllowOverride None
        Require all granted
        ForceType application/octet-stream
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/artilody-error.log
    CustomLog ${APACHE_LOG_DIR}/artilody-access.log combined
</VirtualHost>
